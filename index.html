      ]
    };

    // cp gekalibreerd op CoolProp (effectieve waarden bij typische SH/SC)
    const CP = {
      R134a: { v: 0.88, l: 1.48 },
      R513A: { v: 0.90, l: 1.47 },
      R410A: { v: 1.05, l: 1.90 },
      R32:   { v: 1.15, l: 2.10 }
    };

    // CoolProp referentieresultaten (gegenereerd met CoolProp 8.0.0)
    const REF = [
      { ref:'R134a', Te:-10, Tc:40, SH:5, SC:5, eta:0.70, h1:396.93, h2s:431.64, h2:446.52, h3:248.99, q0:147.93, w:49.59, COP:2.983 },
      { ref:'R134a', Te:-13, Tc:37, SH:10, SC:5, eta:0.70, h1:399.25, h2s:435.65, h2:451.24, h3:244.62, q0:154.64, w:51.99, COP:2.974 },
      { ref:'R134a', Te:0, Tc:45, SH:5, SC:5, eta:0.75, h1:403.07, h2s:432.52, h2:442.33, h3:256.38, q0:146.69, w:39.26, COP:3.736 },
      { ref:'R134a', Te:-20, Tc:35, SH:10, SC:5, eta:0.70, h1:394.71, h2s:436.25, h2:454.05, h3:241.72, q0:152.99, w:59.34, COP:2.578 },
      { ref:'R513A', Te:-10, Tc:40, SH:5, SC:5, eta:0.70, h1:380.05, h2s:411.11, h2:424.43, h3:250.91, q0:129.14, w:44.37, COP:2.910 },
      { ref:'R513A', Te:-13, Tc:37, SH:10, SC:5, eta:0.70, h1:382.42, h2s:415.03, h2:429.01, h3:246.56, q0:135.86, w:46.59, COP:2.916 },
      { ref:'R410A', Te:-10, Tc:40, SH:5, SC:5, eta:0.70, h1:423.17, h2s:464.83, h2:482.68, h3:256.93, q0:166.24, w:59.51, COP:2.794 },
      { ref:'R32', Te:-10, Tc:40, SH:5, SC:5, eta:0.70, h1:518.64, h2s:580.75, h2:607.36, h3:265.08, q0:253.56, w:88.72, COP:2.858 }
    ];

    function satProps(ref, T) {
      const tab = data[ref];
      if (!tab) return null;
      if (T < tab[0][0] - 0.01 || T > tab[tab.length-1][0] + 0.01) return null;
      if (T <= tab[0][0]) return rowToObj(tab[0]);
      if (T >= tab[tab.length-1][0]) return rowToObj(tab[tab.length-1]);
      for (let i = 0; i < tab.length - 1; i++) {
        const t1 = tab[i][0], t2 = tab[i+1][0];
        if (T >= t1 && T <= t2) {
          const f = (T - t1) / (t2 - t1);
          return {
            T: T,
            P:  tab[i][1] + f * (tab[i+1][1] - tab[i][1]),
            hf: tab[i][2] + f * (tab[i+1][2] - tab[i][2]),
            hg: tab[i][3] + f * (tab[i+1][3] - tab[i][3]),
            sf: tab[i][4] + f * (tab[i+1][4] - tab[i][4]),
            sg: tab[i][5] + f * (tab[i+1][5] - tab[i][5])
          };
        }
      }
      return null;
    }
    function rowToObj(r) { return { T:r[0], P:r[1], hf:r[2], hg:r[3], sf:r[4], sg:r[5] }; }

    function TfromP(ref, P) {
      const tab = data[ref];
      if (!tab) return null;
      if (P < tab[0][1] || P > tab[tab.length-1][1]) return null; // GEEN stille clamp
      for (let i = 0; i < tab.length - 1; i++) {
        const p1 = tab[i][1], p2 = tab[i+1][1];
        if (P >= p1 && P <= p2) {
          const f = (P - p1) / (p2 - p1);
          return tab[i][0] + f * (tab[i+1][0] - tab[i][0]);
        }
      }
      return null;
    }

    function state1(ref, Te, Pe, SH) {
      const sat = satProps(ref, Te);
      if (!sat) return null;
      const cpv = (CP[ref] || CP.R134a).v;
      const T1 = Te + Math.max(SH, 0);
      const h1 = sat.hg + cpv * Math.max(SH, 0);
      const s1 = sat.sg + cpv * Math.log(Math.max((T1 + 273.15) / (Te + 273.15), 1.0001));
      return { T: T1, P: Pe, h: h1, s: s1 };
    }

    function state3(ref, Tc, Pc, SC) {
      const sat = satProps(ref, Tc);
      if (!sat) return null;
      const cpl = (CP[ref] || CP.R134a).l;
      const T3 = Tc - Math.max(SC, 0);
      const h3 = sat.hf - cpl * Math.max(SC, 0);
      const s3 = sat.sf - cpl * Math.log(Math.max((Tc + 273.15) / (T3 + 273.15), 1.0001));
      return { T: T3, P: Pc, h: h3, s: s3 };
    }

    function findIsentropic(ref, P2, s1) {
      const Tsat2 = TfromP(ref, P2);
      if (Tsat2 === null) return null;
      const sat2 = satProps(ref, Tsat2);
      if (!sat2) return null;
      const cpv = (CP[ref] || CP.R134a).v;

      let Tlow = Tsat2 + 0.5, Thigh = Tsat2 + 180;
      let bestT = Tlow, bestDiff = 1e9;
      for (let i = 0; i < 60; i++) {
        const Tmid = (Tlow + Thigh) / 2;
        const s_mid = sat2.sg + cpv * Math.log(Math.max((Tmid + 273.15) / (Tsat2 + 273.15), 1.0001));
        const diff = s_mid - s1;
        if (Math.abs(diff) < bestDiff) { bestDiff = Math.abs(diff); bestT = Tmid; }
        if (Math.abs(diff) < 0.0008) break;
        if (diff > 0) Thigh = Tmid; else Tlow = Tmid;
      }
      const SH2s = bestT - Tsat2;
      const h2s = sat2.hg + cpv * Math.max(SH2s, 0);
      const s2s = sat2.sg + cpv * Math.log(Math.max((bestT + 273.15) / (Tsat2 + 273.15), 1.0001));
      return { T: bestT, P: P2, h: h2s, s: s2s };
    }

    function berekenCyclus(inp) {
      const ref = inp.ref || 'R134a';
      let Te = inp.Te, Tc = inp.Tc, Pe, Pc;

      if (inp.Pv > 0) {
        Pe = inp.Pv;
        Te = TfromP(ref, Pe);
        if (Te === null) return { error: 'Verdampingsdruk buiten tabelbereik (' + data[ref][0][1].toFixed(2) + '–' + data[ref].at(-1)[1].toFixed(2) + ' bar).' };
      } else {
        const satE = satProps(ref, Te);
        if (!satE) return { error: 'Verdampings-temperatuur buiten bereik (−40…60 °C).' };
        Pe = satE.P;
      }

      if (inp.Pc > 0) {
        Pc = inp.Pc;
        Tc = TfromP(ref, Pc);
        if (Tc === null) return { error: 'Condensatiedruk buiten tabelbereik.' };
      } else {
        const satC = satProps(ref, Tc);
        if (!satC) return { error: 'Condensatie-temperatuur buiten bereik (−40…60 °C).' };
        Pc = satC.P;
      }

      let SH = 0, SC = 0;
      if (inp.Tzuig !== undefined && !isNaN(inp.Tzuig)) SH = inp.Tzuig - Te;
      if (inp.Tvloe !== undefined && !isNaN(inp.Tvloe)) SC = Tc - inp.Tvloe;

      const st1 = state1(ref, Te, Pe, SH);
      const st3 = state3(ref, Tc, Pc, SC);
      if (!st1 || !st3) return { error: 'Kon toestand 1 of 3 niet berekenen.' };

      const h4 = st3.h;
      const st4 = { T: null, P: Pe, h: h4, s: null };
      const st2s = findIsentropic(ref, Pc, st1.s);
      if (!st2s) return { error: 'Kon isentrope toestand 2s niet vinden.' };

      const eta = (inp.eta > 0 && inp.eta <= 1) ? inp.eta : 0.70;
      const h2 = st1.h + (st2s.h - st1.h) / eta;

      const Tsat2 = TfromP(ref, Pc);
      const sat2 = satProps(ref, Tsat2);
      const cpv = (CP[ref] || CP.R134a).v;
      const SH2 = (h2 - sat2.hg) / cpv;
      const T2 = Tsat2 + Math.max(SH2, 0);
      const st2 = { T: T2, P: Pc, h: h2, s: null };

      const q0 = st1.h - h4;
      const w  = h2 - st1.h;
      const qc = h2 - st3.h;
      const COP_R = q0 / w;
      const COP_H = qc / w;
      const pi = Pc / Pe;

      let m = null, Wcomp = null, Qevap = null, Qcond = null;
      if (inp.Qcomp > 0) { Wcomp = inp.Qcomp; m = Wcomp / w; }
      else if (inp.m > 0) { m = inp.m; Wcomp = m * w; }
      if (m !== null) { Qevap = m * q0; Qcond = m * qc; }

      let balans = null, balansPct = null;
      if (Qevap !== null && Wcomp !== null && Qcond !== null) {
        const som = Qevap + Wcomp;
        balansPct = Math.abs(Qcond - som) / Math.max(Qcond, 0.01) * 100;
        balans = balansPct < 2.5 ? 'OK' : 'Afwijking';
      }

      return {
        ref, Te, Tc, Pe, Pc, SH, SC, eta, pi,
        st1, st2, st2s, st3, st4,
        h1: st1.h, h2, h2s: st2s.h, h3: st3.h, h4,
        q0, w, qc, COP_R, COP_H,
        m, Wcomp, Qevap, Qcond, balans, balansPct,
        Tzuig: inp.Tzuig, Tvloe: inp.Tvloe
      };
    }

    function valideer(r) {
      if (r.error) return [r.error];
      const f = [];
      if (r.Tc <= r.Te) f.push('Condensatietemperatuur moet hoger zijn dan verdampingstemperatuur.');
      if (r.Pc <= r.Pe) f.push('Condensatiedruk moet hoger zijn dan verdampingsdruk.');
      if (r.SH < -0.3) f.push('Oververhitting is negatief.');
      if (r.SC < -0.3) f.push('Onderkoeling is negatief.');
      if (r.eta <= 0 || r.eta > 1) f.push('ηis moet tussen 0 en 1 liggen.');
      if (r.w <= 0) f.push('Compressorarbeid moet positief zijn.');
      if (r.q0 <= 0) f.push('Specifiek koelvermogen moet positief zijn.');
      if (r.h2s <= r.h1) f.push('h₂s moet groter zijn dan h₁.');
      if (r.h2 < r.h2s - 0.5) f.push('h₂ mag niet kleiner zijn dan h₂s.');
      return f;
    }

    function pct(calc, ref) {
      if (!ref || Math.abs(ref) < 1e-9) return '—';
      return ((calc - ref) / Math.abs(ref) * 100).toFixed(1) + '%';
    }

    function runValidation() {
      const rows = [];
      for (const t of REF) {
        const r = berekenCyclus({
          ref: t.ref, Te: t.Te, Tc: t.Tc,
          Tzuig: t.Te + t.SH, Tvloe: t.Tc - t.SC, eta: t.eta
        });
        if (r.error) {
          rows.push({ ...t, error: r.error });
          continue;
        }
        rows.push({
          ref: t.ref, Te: t.Te, Tc: t.Tc, SH: t.SH, SC: t.SC, eta: t.eta,
          h1_c: r.h1, h1_r: t.h1, dh1: pct(r.h1, t.h1),
          h2s_c: r.h2s, h2s_r: t.h2s, dh2s: pct(r.h2s, t.h2s),
          h2_c: r.h2, h2_r: t.h2, dh2: pct(r.h2, t.h2),
          h3_c: r.h3, h3_r: t.h3, dh3: pct(r.h3, t.h3),
          q0_c: r.q0, q0_r: t.q0, dq0: pct(r.q0, t.q0),
          w_c: r.w, w_r: t.w, dw: pct(r.w, t.w),
          COP_c: r.COP_R, COP_r: t.COP, dCOP: pct(r.COP_R, t.COP)
        });
      }
      return rows;
    }

    function toonValidatie() {
      document.getElementById('menuCard').classList.add('hidden');
      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('diagramWrap').classList.add('hidden');

      const rows = runValidation();
      let html = `<div class="step"><h3>Validatie tegen CoolProp 8.0.0</h3>
        <p style="font-size:0.8rem;color:#94a3b8">Tabellen gegenereerd met CoolProp. Superheat/subcool via gekalibreerde cp. Doel: &lt;1–3 % op q0/w/COP.</p>
        <table class="val">
          <tr><th>Ref</th><th>Te/Tc</th><th>h1 Δ%</th><th>h2s Δ%</th><th>h2 Δ%</th><th>h3 Δ%</th><th>q0 Δ%</th><th>w Δ%</th><th>COP Δ%</th></tr>`;
      for (const r of rows) {
        if (r.error) {
          html += `<tr><td colspan="9" class="error">${r.ref}: ${r.error}</td></tr>`;
          continue;
        }
        html += `<tr>
          <td style="text-align:left">${r.ref}</td>
          <td>${r.Te}/${r.Tc}</td>
          <td>${r.dh1}</td><td>${r.dh2s}</td><td>${r.dh2}</td><td>${r.dh3}</td>
          <td>${r.dq0}</td><td>${r.dw}</td><td>${r.dCOP}</td>
        </tr>`;
      }
      html += `</table></div>
        <div class="step"><h3>Toelichting</h3>
          <p style="font-size:0.8rem">Afwijkingen komen vooral uit het cp-model voor oververhitte damp en onderkoelde vloeistof. Verzadigingswaarden (P, hf, hg) komen rechtstreeks uit CoolProp en zijn &lt;0.1 % nauwkeurig. Voor Categorie-1 is &lt;3 % op COP acceptabel.</p>
        </div>`;
      document.getElementById('resultaat').innerHTML = html;
    }

    function info(tekst) {
      return `<span class="info">i<span class="tooltip">${tekst}</span></span>`;
    }

    // ========== UI ==========
    let huidigeKeuze = 0;
    const veldSets = {
      1: ['Te','Tzuig'], 2: ['Tc','Tvloe'],
      3: ['Te','Tc','Tzuig','Tvloe','eta'], 4: ['Te','Tc','Tzuig','Tvloe','eta'],
      5: ['Te','Tc','Tzuig','Tvloe','eta'], 6: ['Te','Tc','Tzuig','Tvloe','eta'],
      7: ['Te','Tc','Tzuig','Tvloe','eta'], 8: ['Te','Tc'],
      9: ['Te','Tc','Tzuig','Tvloe','eta','Qcomp'],
      10:['Te','Tc','Tzuig','Tvloe','eta','Qcomp'],
      11:['Te','Tc','Tzuig','Tvloe','eta','Qcomp'],
      12:['Te','Tc','Tzuig','Tvloe','eta','Qcomp']
    };

    function kies(nr) {
      huidigeKeuze = nr;
      document.getElementById('menuCard').classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('inputCard').classList.remove('hidden');

      const titels = {
        1:'1. Oververhitting', 2:'2. Onderkoeling', 3:'3. Specifiek koelvermogen q₀',
        4:'4. Specifiek condensorvermogen q<sub>c</sub>', 5:'5. Specifieke compressorarbeid w',
        6:'6. Koelfactor (EER / COP<sub>R</sub>)', 7:'7. Warmtefactor (COP<sub>H</sub>)',
        8:'8. Drukverhouding π', 9:'9. Massastroom ṁ', 10:'10. Totaal koelvermogen',

      };
      document.getElementById('inputTitel').innerHTML = titels[nr];

      const velden = veldSets[nr];
      let html = `<label>Koudemiddel ${info('Tabellen gegenereerd met CoolProp 8.0.0. R513A = R1234yf/R134a-mengsel.')}</label>

      if (velden.includes('Te')) {
        html += `<label>Verdampingstemperatuur (°C)</label>

    function uitvoeren() {
      const get = id => {
        const el = document.getElementById(id);
        if (!el) return undefined;
        const v = parseFloat(el.value);
        return isNaN(v) ? undefined : v;
      };
      const inp = {
        ref: document.getElementById('ref')?.value || 'R134a',
        Te: get('Te'), Tc: get('Tc'),
        Tzuig: get('Tzuig'), Tvloe: get('Tvloe'),
        eta: get('eta'), Qcomp: get('Qcomp'),
        Pv: get('Pv'), Pc: get('Pc')
      };
      if (veldSets[huidigeKeuze].includes('Te') && inp.Te === undefined) { alert('Vul Te in.'); return; }
      if (veldSets[huidigeKeuze].includes('Tc') && inp.Tc === undefined) { alert('Vul Tc in.'); return; }

      const r = berekenCyclus(inp);
      const fouten = valideer(r);
      let html = '';
      if (fouten.length) {
        html += `<div class="step" style="border-left-color:#f87171"><h3 class="error">Controleer de invoer</h3>${fouten.map(f=>`<p class="error">• ${f}</p>`).join('')}</div>`;
        document.getElementById('inputCard').classList.add('hidden');
        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('resultaat').innerHTML = html;
        document.getElementById('diagramWrap').classList.add('hidden');
        return;
      }

      if (huidigeKeuze === 1) {
        html += `<div class="step"><h3>Gegeven</h3>T<sub>zuiggas</sub> = <span class="value">${(r.Tzuig??0).toFixed(1)} °C</span><br>T<sub>verdamping</sub> = <span class="value">${r.Te.toFixed(1)} °C</span></div>
          <div class="step"><h3>Formule</h3><span class="formula">ΔT<sub>over</sub> = T<sub>zuiggas</sub> − T<sub>verdamping</sub></span></div>
          <div class="step"><h3>Berekening</h3>ΔT<sub>over</sub> = ${(r.Tzuig??0).toFixed(1)} − (${r.Te.toFixed(1)}) = <span class="value">${r.SH.toFixed(1)} K</span><div class="result-big">ΔT<sub>over</sub> = ${r.SH.toFixed(1)} K</div></div>`;
      } else if (huidigeKeuze === 2) {
        html += `<div class="step"><h3>Gegeven</h3>T<sub>condensatie</sub> = <span class="value">${r.Tc.toFixed(1)} °C</span><br>T<sub>vloeistof</sub> = <span class="value">${(r.Tvloe??0).toFixed(1)} °C</span></div>
          <div class="step"><h3>Formule</h3><span class="formula">ΔT<sub>onder</sub> = T<sub>condensatie</sub> − T<sub>vloeistof</sub></span></div>
          <div class="step"><h3>Berekening</h3>ΔT<sub>onder</sub> = ${r.Tc.toFixed(1)} − ${(r.Tvloe??0).toFixed(1)} = <span class="value">${r.SC.toFixed(1)} K</span><div class="result-big">ΔT<sub>onder</sub> = ${r.SC.toFixed(1)} K</div></div>`;
      } else if (huidigeKeuze >= 3) {
        html += toonToestanden(r);
        if (huidigeKeuze === 3) html += `<div class="step"><h3>Specifiek koelvermogen</h3><span class="formula">q₀ = h₁ − h₄</span><br>q₀ = ${r.h1.toFixed(1)} − ${r.h4.toFixed(1)} = <span class="value">${r.q0.toFixed(1)} kJ/kg</span><div class="result-big">q₀ = ${r.q0.toFixed(1)} kJ/kg</div></div>`;
        if (huidigeKeuze === 4) html += `<div class="step"><h3>Specifiek condensorvermogen</h3><span class="formula">q<sub>c</sub> = h₂ − h₃</span><br>q<sub>c</sub> = ${r.h2.toFixed(1)} − ${r.h3.toFixed(1)} = <span class="value">${r.qc.toFixed(1)} kJ/kg</span><div class="result-big">q<sub>c</sub> = ${r.qc.toFixed(1)} kJ/kg</div></div>`;
        if (huidigeKeuze === 5) html += `<div class="step"><h3>Specifieke compressorarbeid</h3><span class="formula">w = h₂ − h₁</span><br>w = ${r.h2.toFixed(1)} − ${r.h1.toFixed(1)} = <span class="value">${r.w.toFixed(1)} kJ/kg</span><div class="result-big">w = ${r.w.toFixed(1)} kJ/kg</div></div>`;
        if (huidigeKeuze === 6) html += `<div class="step"><h3>Koelfactor (EER / COP<sub>R</sub>)</h3><span class="formula">EER = q₀ / w</span><br>EER = ${r.q0.toFixed(1)} / ${r.w.toFixed(1)} = <span class="value">${r.COP_R.toFixed(2)}</span><div class="result-big">EER / COP<sub>R</sub> = ${r.COP_R.toFixed(2)}</div></div>`;
        if (huidigeKeuze === 7) html += `<div class="step"><h3>Warmtefactor (COP<sub>H</sub>)</h3><span class="formula">COP<sub>H</sub> = q<sub>c</sub> / w</span><br>COP<sub>H</sub> = ${r.qc.toFixed(1)} / ${r.w.toFixed(1)} = <span class="value">${r.COP_H.toFixed(2)}</span><div class="result-big">COP<sub>H</sub> = ${r.COP_H.toFixed(2)}</div></div>`;
        if (huidigeKeuze === 8) html += `<div class="step"><h3>Drukverhouding</h3><span class="formula">π = p<sub>c</sub> / p<sub>v</sub></span><br>π = ${r.Pc.toFixed(2)} / ${r.Pe.toFixed(2)} = <span class="value">${r.pi.toFixed(2)}</span><div class="result-big">π = ${r.pi.toFixed(2)}</div></div>`;
        if (huidigeKeuze >= 9) {
          if (r.m === null) html += `<div class="step"><p class="warn">Vul compressorvermogen in voor massastroom.</p></div>`;
          else {
            html += `<div class="step"><h3>Massastroom</h3><span class="formula">ṁ = W<sub>comp</sub> / w</span><br>ṁ = ${r.Wcomp.toFixed(2)} / ${r.w.toFixed(1)} = <span class="value">${r.m.toFixed(4)} kg/s</span><div class="result-big">ṁ = ${r.m.toFixed(4)} kg/s</div></div>`;
            if (huidigeKeuze === 10 || huidigeKeuze === 12) html += `<div class="step"><h3>Totaal koelvermogen</h3>Q<sub>verdamper</sub> = <span class="value">${r.Qevap.toFixed(2)} kW</span><div class="result-big">Q<sub>verdamper</sub> = ${r.Qevap.toFixed(2)} kW</div></div>`;
            if (huidigeKeuze === 11 || huidigeKeuze === 12) html += `<div class="step"><h3>Totaal condensorvermogen</h3>Q<sub>condensor</sub> = <span class="value">${r.Qcond.toFixed(2)} kW</span><div class="result-big">Q<sub>condensor</sub> = ${r.Qcond.toFixed(2)} kW</div></div>`;
          }
        }
        if (huidigeKeuze === 12) {
          html += `<div class="step"><h3>Oververhitting & Onderkoeling</h3>ΔT<sub>over</sub> = <span class="value">${r.SH.toFixed(1)} K</span> | ΔT<sub>onder</sub> = <span class="value">${r.SC.toFixed(1)} K</span></div>
            <div class="step"><h3>Specifieke grootheden</h3>q₀ = <span class="value">${r.q0.toFixed(1)} kJ/kg</span><br>w = <span class="value">${r.w.toFixed(1)} kJ/kg</span><br>q<sub>c</sub> = <span class="value">${r.qc.toFixed(1)} kJ/kg</span></div>
            <div class="step"><h3>Rendementen</h3>EER / COP<sub>R</sub> = <span class="value">${r.COP_R.toFixed(2)}</span><br>COP<sub>H</sub> = <span class="value">${r.COP_H.toFixed(2)}</span><br>π = <span class="value">${r.pi.toFixed(2)}</span><div class="result-big">COP<sub>R</sub> = ${r.COP_R.toFixed(2)}</div></div>`;
          if (r.m !== null) {
            html += `<div class="step"><h3>Massastroom & Vermogens</h3>ṁ = <span class="value">${r.m.toFixed(4)} kg/s</span><br>W<sub>comp</sub> = <span class="value">${r.Wcomp.toFixed(2)} kW</span><br>Q<sub>verdamper</sub> = <span class="value">${r.Qevap.toFixed(2)} kW</span><br>Q<sub>condensor</sub> = <span class="value">${r.Qcond.toFixed(2)} kW</span></div>
              <div class="step"><h3>Energiebalans</h3>${r.Qcond.toFixed(2)} ≈ ${r.Qevap.toFixed(2)} + ${r.Wcomp.toFixed(2)} = ${(r.Qevap+r.Wcomp).toFixed(2)} kW<br>${r.balans==='OK'?`<span class="ok">✓ OK (${r.balansPct.toFixed(1)} %)</span>`:`<span class="warn">⚠ ${r.balansPct.toFixed(1)} %</span>`}</div>`;
          }
        }
      }

      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('resultaat').innerHTML = html;
      if (huidigeKeuze >= 3) { document.getElementById('diagramWrap').classList.remove('hidden'); tekenPH(r); }
      else document.getElementById('diagramWrap').classList.add('hidden');
    }

    function toonToestanden(r) {
      return `<div class="step"><h3>Invoer & verzadiging</h3>Koudemiddel: <span class="value">${r.ref}</span><br>T<sub>e</sub> = <span class="value">${r.Te.toFixed(1)} °C</span> → p<sub>v</sub> ≈ ${r.Pe.toFixed(2)} bar<br>T<sub>c</sub> = <span class="value">${r.Tc.toFixed(1)} °C</span> → p<sub>c</sub> ≈ ${r.Pc.toFixed(2)} bar<br>SH = <span class="value">${r.SH.toFixed(1)} K</span> | SC = <span class="value">${r.SC.toFixed(1)} K</span> | η<sub>is</sub> = ${r.eta.toFixed(2)}</div>
        <div class="step"><h3>Toestandspunten</h3><strong>1</strong> Aanzuiging: T₁≈${r.st1.T.toFixed(1)}°C, h₁ = <span class="value">${r.h1.toFixed(1)} kJ/kg</span>, s₁ ≈ ${r.st1.s.toFixed(3)}<br><strong>2s</strong> Isentroop: T₂s≈${r.st2s.T.toFixed(1)}°C, h₂s = <span class="value">${r.h2s.toFixed(1)} kJ/kg</span><br><strong>2</strong> Persgas: T₂≈${r.st2.T.toFixed(1)}°C, h₂ = <span class="value">${r.h2.toFixed(1)} kJ/kg</span><br><strong>3</strong> Vloeistof: T₃≈${r.st3.T.toFixed(1)}°C, h₃ = <span class="value">${r.h3.toFixed(1)} kJ/kg</span><br><strong>4</strong> Na expansie: h₄ = <span class="value">${r.h4.toFixed(1)} kJ/kg</span></div>`;
    }

    function tekenPH(r) {
      const canvas = document.getElementById('phCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);
      const tab = data[r.ref] || data.R134a;
      const hs = [r.h1, r.h2, r.h3, r.h4];
      tab.forEach(pt => { hs.push(pt[2]); hs.push(pt[3]); });
      let hMin = Math.max(80, Math.min(...hs) - 25);
      let hMax = Math.min(620, Math.max(...hs) + 35);
      let pMin = Math.max(0.2, Math.min(r.Pe, r.Pc) * 0.45);
      let pMax = Math.min(50, Math.max(r.Pe, r.Pc) * 1.9);
      const left=70, right=25, top=28, bottom=48;
      const plotW = W-left-right, plotH = H-top-bottom;
      function x(h){ return left + (h-hMin)/(hMax-hMin)*plotW; }
      function y(p){ const lp = Math.log10(Math.max(p,0.1)); return top + plotH - (lp-Math.log10(pMin))/(Math.log10(pMax)-Math.log10(pMin))*plotH; }
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
      for (let h = Math.ceil(hMin/50)*50; h <= hMax; h += 50) { ctx.beginPath(); ctx.moveTo(x(h),top); ctx.lineTo(x(h),top+plotH); ctx.stroke(); }
      ctx.beginPath(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.4;
      tab.forEach((pt,i) => { const xx=x(pt[2]),yy=y(pt[1]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }); ctx.stroke();
      ctx.beginPath(); ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 2.4;
      tab.forEach((pt,i) => { const xx=x(pt[3]),yy=y(pt[1]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }); ctx.stroke();
      ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(x(r.h4),y(r.Pe)); ctx.lineTo(x(r.h1),y(r.Pe)); ctx.lineTo(x(r.h2),y(r.Pc)); ctx.lineTo(x(r.h3),y(r.Pc)); ctx.lineTo(x(r.h4),y(r.Pe)); ctx.stroke();
      [{h:r.h1,p:r.Pe,l:'1'},{h:r.h2s,p:r.Pc,l:'2s'},{h:r.h2,p:r.Pc,l:'2'},{h:r.h3,p:r.Pc,l:'3'},{h:r.h4,p:r.Pe,l:'4'}].forEach(pt=>{
        ctx.beginPath(); ctx.fillStyle = pt.l==='2s'?'#a78bfa':'#fbbf24';
        ctx.arc(x(pt.h),y(pt.p),pt.l==='2s'?5:6.5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#0f172a'; ctx.font='bold 10px system-ui';
        ctx.fillText(pt.l, x(pt.h)-(pt.l.length>1?6:3), y(pt.p)+3.5);
      });
      ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(left,top+plotH); ctx.lineTo(left+plotW,top+plotH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left,top); ctx.lineTo(left,top+plotH); ctx.stroke();
      ctx.fillStyle='#94a3b8'; ctx.font='11px system-ui'; ctx.textAlign='center';
      for (let h=Math.ceil(hMin/50)*50; h<=hMax; h+=50) ctx.fillText(h.toString(), x(h), top+plotH+15);
      ctx.font='12px system-ui'; ctx.fillText('Enthalpie h (kJ/kg)', left+plotW/2, H-6);
      ctx.textAlign='right'; ctx.font='11px system-ui';
      [0.5,1,2,3,5,10,15,20,30,40].forEach(p=>{ if(p>=pMin&&p<=pMax) ctx.fillText(p.toString(), left-5, y(p)+3); });
      ctx.save(); ctx.translate(14, top+plotH/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.font='12px system-ui'; ctx.fillText('Druk p (bar abs) – log', 0, 0); ctx.restore();
      ctx.fillStyle='#38bdf8'; ctx.font='bold 12px system-ui'; ctx.textAlign='left'; ctx.fillText(r.ref+' – CoolProp-tabellen', left, 16);
    }

    function terug() {
      document.getElementById('menuCard').classList.remove('hidden');
      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('diagramWrap').classList.add('hidden');
    }

    // Run validation once on load (console)
    console.log('CoolProp-validatie (afwijking %):');
    runValidation().forEach(r => {
      if (r.error) console.warn(r.ref, r.error);
      else console.log(r.ref, r.Te+'/'+r.Tc, 'q0', r.dq0, 'w', r.dw, 'COP', r.dCOP);
    });
  </script>
