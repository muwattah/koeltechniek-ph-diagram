<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koeltechniek Categorie 1 – Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 4px; font-size: 1.4rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 18px; font-size: 0.88rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 18px; border: 1px solid #334155; margin-bottom: 14px; }
    h2 { color: #38bdf8; font-size: 1.05rem; margin-bottom: 12px; }
    .menu-btn { display: block; width: 100%; text-align: left; padding: 10px 14px; margin-bottom: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 0.9rem; cursor: pointer; transition: all 0.15s; }
    .menu-btn:hover { background: #1e293b; border-color: #0ea5e9; color: #38bdf8; }
    label { display: block; margin-bottom: 3px; font-size: 0.8rem; color: #94a3b8; }
    .hint { font-size: 0.72rem; color: #64748b; margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 11px; margin-bottom: 11px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.92rem; }
    button.calc { width: 100%; padding: 12px; background: #0ea5e9; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    button.calc:hover { background: #0284c7; }
    button.back { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 9px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
    button.back:hover { border-color: #94a3b8; color: #e2e8f0; }
    .step { background: #0f172a; border-radius: 8px; padding: 11px 13px; margin-bottom: 9px; border-left: 4px solid #0ea5e9; }
    .step h3 { color: #38bdf8; font-size: 0.88rem; margin-bottom: 5px; }
    .formula { font-family: ui-monospace, monospace; background: #1e293b; padding: 2px 5px; border-radius: 4px; color: #4ade80; font-size: 0.84rem; }
    .value { color: #fbbf24; font-weight: 600; }
    .result-big { font-size: 1.3rem; font-weight: 700; color: #4ade80; margin-top: 5px; }
    .ok { color: #4ade80; }
    .warn { color: #fbbf24; }
    .error { color: #f87171; }
    .hidden { display: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    canvas { width: 100%; max-width: 100%; background: #0f172a; border-radius: 8px; border: 1px solid #334155; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 0.75rem; color: #94a3b8; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    /* Info bolletje */
    .info { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: #334155; color: #94a3b8; font-size: 0.65rem; font-weight: 700; cursor: help; margin-left: 4px; vertical-align: middle; position: relative; }
    .info:hover { background: #0ea5e9; color: white; }
    .info .tooltip { visibility: hidden; width: 240px; background: #1e293b; color: #e2e8f0; text-align: left; border-radius: 8px; padding: 8px 10px; position: absolute; z-index: 20; bottom: 125%; left: 50%; margin-left: -120px; opacity: 0; transition: opacity 0.2s; font-size: 0.72rem; font-weight: 400; border: 1px solid #475569; line-height: 1.35; pointer-events: none; }
    .info:hover .tooltip { visibility: visible; opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Koeltechniek – Categorie 1</h1>
    <p class="subtitle">Kies een berekening → vul alleen basisgegevens in → alles wordt automatisch berekend</p>

    <div class="card" id="menuCard">
      <h2>Welke berekening wil je uitvoeren?</h2>
      <button class="menu-btn" onclick="kies(1)">1. Oververhitting (ΔT<sub>over</sub>)</button>
      <button class="menu-btn" onclick="kies(2)">2. Onderkoeling (ΔT<sub>onder</sub>)</button>
      <button class="menu-btn" onclick="kies(3)">3. Specifiek koelvermogen (q₀)</button>
      <button class="menu-btn" onclick="kies(4)">4. Specifiek condensorvermogen (q<sub>c</sub>)</button>
      <button class="menu-btn" onclick="kies(5)">5. Specifieke compressorarbeid (w)</button>
      <button class="menu-btn" onclick="kies(6)">6. Koelfactor (EER / COP<sub>R</sub>)</button>
      <button class="menu-btn" onclick="kies(7)">7. Warmtefactor (COP<sub>H</sub>)</button>
      <button class="menu-btn" onclick="kies(8)">8. Drukverhouding (π)</button>
      <button class="menu-btn" onclick="kies(9)">9. Massastroom (ṁ)</button>
      <button class="menu-btn" onclick="kies(10)">10. Totaal koelvermogen (Q<sub>verdamper</sub>)</button>
      <button class="menu-btn" onclick="kies(11)">11. Totaal condensorvermogen (Q<sub>condensor</sub>)</button>
      <button class="menu-btn" onclick="kies(12)" style="border-color:#0ea5e9;color:#38bdf8;">12. Complete set (volledige koelcyclus + p-h diagram) ★</button>
    </div>

    <div class="card hidden" id="inputCard">
      <h2 id="inputTitel">Gegevens</h2>
      <div id="inputVelden"></div>
      <button class="calc" onclick="uitvoeren()">Bereken</button>
      <button class="back" onclick="terug()">← Terug naar menu</button>
    </div>

    <div class="card hidden" id="resultCard">
      <h2>Stap-voor-stap uitwerking</h2>
      <div id="resultaat"></div>
      <div id="diagramWrap" class="hidden" style="margin-top:14px;">
        <canvas id="phCanvas" width="860" height="480"></canvas>
        <div class="legend">
          <span><div class="dot" style="background:#38bdf8"></div> Verz. vloeistof</span>
          <span><div class="dot" style="background:#f472b6"></div> Verz. damp</span>
          <span><div class="dot" style="background:#4ade80"></div> Cyclus 1-2-3-4</span>
          <span><div class="dot" style="background:#fbbf24"></div> Punten</span>
        </div>
      </div>
      <button class="back" onclick="terug()">← Nieuwe berekening</button>
    </div>
  </div>

  <script>
    /* =========================================================
       VERZADIGINGSTABELLEN
       Kolommen: T(°C), P(bar), hf, hg, sf, sg
       Waarden gebaseerd op publieke koudemiddeltabellen (benaderd maar consistent).
       ========================================================= */
    const data = {
      R134a: [
        [-40,0.51,137,372,0.797,1.750],
        [-30,0.84,151,379,0.845,1.736],
        [-20,1.33,167,386,0.892,1.723],
        [-10,2.01,183,392,0.938,1.710],
        [0,2.93,200,399,0.983,1.698],
        [10,4.15,217,404,1.027,1.686],
        [20,5.72,236,409,1.071,1.675],
        [30,7.70,254,414,1.114,1.664],
        [40,10.17,274,419,1.156,1.653],
        [50,13.18,294,422,1.198,1.642],
        [60,16.82,315,424,1.239,1.631]
      ],
      R513A: [
        [-40,0.62,150,350,0.810,1.660],
        [-30,0.99,162,357,0.855,1.655],
        [-20,1.53,174,363,0.900,1.650],
        [-10,2.27,187,370,0.945,1.648],
        [0,3.25,200,376,0.990,1.645],
        [10,4.53,213,382,1.035,1.643],
        [20,6.17,227,388,1.080,1.642],
        [30,8.21,241,393,1.125,1.640],
        [40,10.73,256,398,1.170,1.638],
        [50,13.78,271,402,1.215,1.636],
        [60,17.44,287,406,1.260,1.635]
      ],
      R410A: [
        [-40,1.80,140,400,0.75,1.80],
        [-20,4.00,170,415,0.85,1.78],
        [0,8.00,200,430,0.95,1.76],
        [20,14.5,240,440,1.05,1.74],
        [40,24.0,280,450,1.15,1.72]
      ],
      R32: [
        [-40,1.30,130,480,0.70,1.95],
        [-20,3.30,160,500,0.80,1.92],
        [0,7.10,200,520,0.90,1.90],
        [20,13.5,250,535,1.00,1.88],
        [40,23.5,300,545,1.10,1.85]
      ]
    };

    // Gemiddelde cp-waarden (kJ/kg·K) – gebruikt voor superheat/subcool correctie
    // Dit blijft een modelbenadering zolang geen volledige Helmholtz-data aanwezig is.
    const CP = {
      R134a: { v: 1.02, l: 1.40 },
      R513A: { v: 1.05, l: 1.38 },
      R410A: { v: 1.15, l: 1.55 },
      R32:   { v: 1.20, l: 1.70 }
    };

    function satProps(ref, T) {
      const tab = data[ref] || data.R134a;
      if (T <= tab[0][0]) return rowToObj(tab[0]);
      if (T >= tab[tab.length-1][0]) return rowToObj(tab[tab.length-1]);
      for (let i=0; i<tab.length-1; i++) {
        const t1 = tab[i][0], t2 = tab[i+1][0];
        if (T >= t1 && T <= t2) {
          const f = (T - t1) / (t2 - t1);
          return {
            T: T,
            P:  tab[i][1] + f*(tab[i+1][1]-tab[i][1]),
            hf: tab[i][2] + f*(tab[i+1][2]-tab[i][2]),
            hg: tab[i][3] + f*(tab[i+1][3]-tab[i][3]),
            sf: tab[i][4] + f*(tab[i+1][4]-tab[i][4]),
            sg: tab[i][5] + f*(tab[i+1][5]-tab[i][5])
          };
        }
      }
    }
    function rowToObj(r){ return {T:r[0],P:r[1],hf:r[2],hg:r[3],sf:r[4],sg:r[5]}; }

    function TfromP(ref, P) {
      const tab = data[ref] || data.R134a;
      if (P <= tab[0][1]) return tab[0][0];
      if (P >= tab[tab.length-1][1]) return tab[tab.length-1][0];
      for (let i=0; i<tab.length-1; i++) {
        const p1=tab[i][1], p2=tab[i+1][1];
        if (P>=p1 && P<=p2) {
          const f=(P-p1)/(p2-p1);
          return tab[i][0] + f*(tab[i+1][0]-tab[i][0]);
        }
      }
      return 0;
    }

    /* =========================================================
       EIGENSCHAPPEN SUPERHEATED / SUBCOOLED
       Model: start vanaf verzadigingspunt + cp·ΔT + ln-term voor s.
       Dit is nog steeds een model, maar consistent en beter dan pure empirie.
       ========================================================= */
    function state1(ref, Te, Pe, SH) {
      const sat = satProps(ref, Te);
      const cpv = (CP[ref] || CP.R134a).v;
      const T1 = Te + Math.max(SH, 0);
      const h1 = sat.hg + cpv * Math.max(SH, 0);
      const s1 = sat.sg + cpv * Math.log(Math.max((T1+273.15)/(Te+273.15), 1.0001));
      return { T: T1, P: Pe, h: h1, s: s1 };
    }

    function state3(ref, Tc, Pc, SC) {
      const sat = satProps(ref, Tc);
      const cpl = (CP[ref] || CP.R134a).l;
      const T3 = Tc - Math.max(SC, 0);
      const h3 = sat.hf - cpl * Math.max(SC, 0);
      const s3 = sat.sf - cpl * Math.log(Math.max((Tc+273.15)/(T3+273.15), 1.0001));
      return { T: T3, P: Pc, h: h3, s: s3 };
    }

    /* =========================================================
       NUMERIEKE ZOEKTOCHT ISENTROPE TOESTAND 2s
       Bij vaste P2 zoeken we T2s zodat s_model(P2,T2s) ≈ s1
       ========================================================= */
    function findIsentropic(ref, P2, s1) {
      const Tsat2 = TfromP(ref, P2);
      const sat2 = satProps(ref, Tsat2);
      const cpv = (CP[ref] || CP.R134a).v;

      let Tlow = Tsat2 + 1;
      let Thigh = Tsat2 + 150;
      let bestT = Tlow;
      let bestDiff = 1e9;

      for (let i = 0; i < 50; i++) {
        const Tmid = (Tlow + Thigh) / 2;
        const s_mid = sat2.sg + cpv * Math.log(Math.max((Tmid+273.15)/(Tsat2+273.15), 1.0001));
        const diff = s_mid - s1;

        if (Math.abs(diff) < bestDiff) {
          bestDiff = Math.abs(diff);
          bestT = Tmid;
        }
        if (Math.abs(diff) < 0.0015) break;

        if (diff > 0) Thigh = Tmid;
        else Tlow = Tmid;
      }

      const SH2s = bestT - Tsat2;
      const h2s = sat2.hg + cpv * Math.max(SH2s, 0);
      const s2s = sat2.sg + cpv * Math.log(Math.max((bestT+273.15)/(Tsat2+273.15), 1.0001));
      return { T: bestT, P: P2, h: h2s, s: s2s };
    }

    /* =========================================================
       CENTRALE REKENLAAG – één bron van waarheid
       ========================================================= */
    function berekenCyclus(inp) {
      const ref = inp.ref || 'R134a';

      let Te = inp.Te, Tc = inp.Tc, Pe, Pc;

      if (inp.Pv > 0) { Pe = inp.Pv; Te = TfromP(ref, Pe); }
      else { Pe = satProps(ref, Te).P; }

      if (inp.Pc > 0) { Pc = inp.Pc; Tc = TfromP(ref, Pc); }
      else { Pc = satProps(ref, Tc).P; }

      let SH = 0, SC = 0;
      if (inp.Tzuig !== undefined && !isNaN(inp.Tzuig)) SH = inp.Tzuig - Te;
      if (inp.Tvloe !== undefined && !isNaN(inp.Tvloe)) SC = Tc - inp.Tvloe;

      // Toestanden
      const st1  = state1(ref, Te, Pe, SH);
      const st3  = state3(ref, Tc, Pc, SC);
      const h4   = st3.h;                       // isenthalpische expansie
      const st4  = { T: null, P: Pe, h: h4, s: null };
      const st2s = findIsentropic(ref, Pc, st1.s);

      const eta = (inp.eta > 0 && inp.eta <= 1) ? inp.eta : 0.70;
      const h2  = st1.h + (st2s.h - st1.h) / eta;

      // T2 uit h2 schatten
      const Tsat2 = TfromP(ref, Pc);
      const sat2  = satProps(ref, Tsat2);
      const cpv   = (CP[ref] || CP.R134a).v;
      const SH2   = (h2 - sat2.hg) / cpv;
      const T2    = Tsat2 + Math.max(SH2, 0);
      const st2   = { T: T2, P: Pc, h: h2, s: null };

      // Specifieke grootheden
      const q0 = st1.h - h4;
      const w  = h2 - st1.h;
      const qc = h2 - st3.h;
      const COP_R = q0 / w;
      const COP_H = qc / w;
      const pi = Pc / Pe;

      // Massastroom / vermogens
      let m = null, Wcomp = null, Qevap = null, Qcond = null;
      if (inp.Qcomp > 0) {
        Wcomp = inp.Qcomp;
        m = Wcomp / w;
      } else if (inp.m > 0) {
        m = inp.m;
        Wcomp = m * w;
      }
      if (m !== null) {
        Qevap = m * q0;
        Qcond = m * qc;
      }

      let balans = null, balansPct = null;
      if (Qevap !== null && Wcomp !== null && Qcond !== null) {
        const som = Qevap + Wcomp;
        balansPct = Math.abs(Qcond - som) / Math.max(Qcond, 0.01) * 100;
        balans = balansPct < 2.5 ? 'OK' : 'Afwijking';
      }

      return {
        ref, Te, Tc, Pe, Pc, SH, SC, eta, pi,
        st1, st2, st2s, st3, st4,
        h1: st1.h, h2, h2s: st2s.h, h3: st3.h, h4,
        q0, w, qc, COP_R, COP_H,
        m, Wcomp, Qevap, Qcond,
        balans, balansPct,
        Tzuig: inp.Tzuig, Tvloe: inp.Tvloe
      };
    }

    function valideer(r) {
      const f = [];
      if (r.Tc <= r.Te) f.push('Condensatietemperatuur moet hoger zijn dan verdampingstemperatuur.');
      if (r.Pc <= r.Pe) f.push('Condensatiedruk moet hoger zijn dan verdampingsdruk.');
      if (r.SH < -0.3) f.push('Oververhitting is negatief. Controleer de zuiggastemperatuur.');
      if (r.SC < -0.3) f.push('Onderkoeling is negatief. Controleer de vloeistoftemperatuur.');
      if (r.eta <= 0 || r.eta > 1) f.push('Isentropisch rendement moet tussen 0 en 1 liggen.');
      if (r.w <= 0) f.push('Compressorarbeid moet positief zijn (h₂ > h₁).');
      if (r.q0 <= 0) f.push('Specifiek koelvermogen moet positief zijn.');
      if (r.h2s <= r.h1) f.push('Isentrope enthalpie h₂s moet groter zijn dan h₁.');
      if (r.h2 < r.h2s - 0.5) f.push('Reële h₂ mag niet kleiner zijn dan h₂s (ηis > 1).');
      if (r.m !== null && r.m <= 0) f.push('Massastroom moet positief zijn.');
      return f;
    }

    // Helper voor info-bolletje
    function info(tekst) {
      return `<span class="info">i<span class="tooltip">${tekst}</span></span>`;
    }

    // ========== UI ==========
    let huidigeKeuze = 0;

    const veldSets = {
      1: ['Te','Tzuig'],
      2: ['Tc','Tvloe'],
      3: ['Te','Tc','Tzuig','Tvloe','eta'],
      4: ['Te','Tc','Tzuig','Tvloe','eta'],
      5: ['Te','Tc','Tzuig','Tvloe','eta'],
      6: ['Te','Tc','Tzuig','Tvloe','eta'],
      7: ['Te','Tc','Tzuig','Tvloe','eta'],
      8: ['Te','Tc'],
      9: ['Te','Tc','Tzuig','Tvloe','eta','Qcomp'],
      10:['Te','Tc','Tzuig','Tvloe','eta','Qcomp'],
      11:['Te','Tc','Tzuig','Tvloe','eta','Qcomp'],
      12:['Te','Tc','Tzuig','Tvloe','eta','Qcomp']
    };

    function kies(nr) {
      huidigeKeuze = nr;
      document.getElementById('menuCard').classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('inputCard').classList.remove('hidden');

      const titels = {
        1:'1. Oververhitting', 2:'2. Onderkoeling', 3:'3. Specifiek koelvermogen q₀',
        4:'4. Specifiek condensorvermogen q<sub>c</sub>', 5:'5. Specifieke compressorarbeid w',
        6:'6. Koelfactor (EER / COP<sub>R</sub>)', 7:'7. Warmtefactor (COP<sub>H</sub>)',
        8:'8. Drukverhouding π', 9:'9. Massastroom ṁ', 10:'10. Totaal koelvermogen',
        11:'11. Totaal condensorvermogen', 12:'12. Complete set – volledige koelcyclus + p-h diagram'
      };
      document.getElementById('inputTitel').innerHTML = titels[nr];

      const velden = veldSets[nr];
      let html = `<label>Koudemiddel ${info('Kies het koudemiddel. De verzadigingstabellen en cp-waarden worden hierop aangepast.')}</label>
        <select id="ref">
          <option value="R134a">R-134a</option>
          <option value="R513A">R-513A</option>
          <option value="R410A">R-410A</option>
          <option value="R32">R-32</option>
        </select>`;

      if (velden.includes('Te')) {
        html += `<label>Verdampingstemperatuur (°C) ${info('Verzadigingstemperatuur aan de lage drukzijde (verdamper).')}</label>
                 <div class="hint">Verzadigingstemperatuur lage drukzijde</div>
                 <input type="number" id="Te" step="0.1" value="-13">`;
      }
      if (velden.includes('Tc')) {
        html += `<label>Condensatietemperatuur (°C) ${info('Verzadigingstemperatuur aan de hoge drukzijde (condensor).')}</label>
                 <div class="hint">Verzadigingstemperatuur hoge drukzijde</div>
                 <input type="number" id="Tc" step="0.1" value="37">`;
      }
      if (velden.includes('Tzuig')) {
        html += `<label>Zuiggastemperatuur T₁ (°C) ${info('Gemeten temperatuur van het gas na de verdamper (vóór de compressor). Hieruit volgt de oververhitting.')}</label>
                 <div class="hint">Gemeten temperatuur na de verdamper</div>
                 <input type="number" id="Tzuig" step="0.1" value="30">`;
      }
      if (velden.includes('Tvloe')) {
        html += `<label>Vloeistoftemperatuur (°C) ${info('Gemeten temperatuur in de vloeistofleiding na de condensor. Hieruit volgt de onderkoeling.')}</label>
                 <div class="hint">Gemeten temperatuur in de vloeistofleiding</div>
                 <input type="number" id="Tvloe" step="0.1" value="26">`;
      }
      if (velden.includes('eta')) {
        html += `<label>Isentropisch rendement η<sub>is</sub> (−) ${info('Verhouding tussen de ideale (isentrope) en de werkelijke compressorarbeid. Typisch 0,65–0,80.')}</label>
                 <div class="hint">Meestal 0,65 – 0,80</div>
                 <input type="number" id="eta" step="0.01" min="0.5" max="1" value="0.70">`;
      }
      if (velden.includes('Qcomp')) {
        html += `<label>Compressorvermogen (kW) – optioneel ${info('Als je dit invult, berekent de calculator de massastroom en de totale vermogens (Qevap en Qcond).')}</label>
                 <div class="hint">Vul dit in als je massastroom en totale vermogens wilt zien</div>
                 <input type="number" id="Qcomp" step="0.01" value="1.34">`;
      }

      if (nr === 8 || nr === 12) {
        html += `<div class="grid-2">
          <div><label>P<sub>v</sub> abs (bar) – optioneel ${info('Als je de druk weet in plaats van de temperatuur, kun je die hier invullen.')}</label>
          <input type="number" id="Pv" step="0.1" placeholder="1.8"></div>
          <div><label>P<sub>c</sub> abs (bar) – optioneel</label>
          <input type="number" id="Pc" step="0.1" placeholder="9.7"></div>
        </div>`;
      }

      document.getElementById('inputVelden').innerHTML = html;
    }

    function uitvoeren() {
      const get = id => {
        const el = document.getElementById(id);
        if (!el) return undefined;
        const v = parseFloat(el.value);
        return isNaN(v) ? undefined : v;
      };

      const inp = {
        ref: document.getElementById('ref')?.value || 'R134a',
        Te: get('Te'), Tc: get('Tc'),
        Tzuig: get('Tzuig'), Tvloe: get('Tvloe'),
        eta: get('eta'), Qcomp: get('Qcomp'),
        Pv: get('Pv'), Pc: get('Pc')
      };

      if (veldSets[huidigeKeuze].includes('Te') && inp.Te === undefined) {
        alert('Vul de verdampingstemperatuur in.'); return;
      }
      if (veldSets[huidigeKeuze].includes('Tc') && inp.Tc === undefined) {
        alert('Vul de condensatietemperatuur in.'); return;
      }

      const r = berekenCyclus(inp);
      const fouten = valideer(r);

      let html = '';
      if (fouten.length) {
        html += `<div class="step" style="border-left-color:#f87171">
          <h3 class="error">Controleer de invoer</h3>
          ${fouten.map(f => `<p class="error">• ${f}</p>`).join('')}
        </div>`;
      }

      if (huidigeKeuze === 1) {
        html += `
          <div class="step"><h3>Gegeven ${info('Oververhitting is het verschil tussen de werkelijke gastemperatuur en de verzadigingstemperatuur bij dezelfde druk.')}</h3>
            T<sub>zuiggas</sub> = <span class="value">${(r.Tzuig??0).toFixed(1)} °C</span><br>
            T<sub>verdamping</sub> = <span class="value">${r.Te.toFixed(1)} °C</span></div>
          <div class="step"><h3>Formule</h3>
            <span class="formula">ΔT<sub>over</sub> = T<sub>zuiggas</sub> − T<sub>verdamping</sub></span></div>
          <div class="step"><h3>Berekening</h3>
            ΔT<sub>over</sub> = ${(r.Tzuig??0).toFixed(1)} − (${r.Te.toFixed(1)}) = <span class="value">${r.SH.toFixed(1)} K</span>
            <div class="result-big">ΔT<sub>over</sub> = ${r.SH.toFixed(1)} K</div></div>`;
      }
      else if (huidigeKeuze === 2) {
        html += `
          <div class="step"><h3>Gegeven ${info('Onderkoeling is het verschil tussen de verzadigingstemperatuur bij de condensatiedruk en de werkelijke vloeistoftemperatuur.')}</h3>
            T<sub>condensatie</sub> = <span class="value">${r.Tc.toFixed(1)} °C</span><br>
            T<sub>vloeistof</sub> = <span class="value">${(r.Tvloe??0).toFixed(1)} °C</span></div>
          <div class="step"><h3>Formule</h3>
            <span class="formula">ΔT<sub>onder</sub> = T<sub>condensatie</sub> − T<sub>vloeistof</sub></span></div>
          <div class="step"><h3>Berekening</h3>
            ΔT<sub>onder</sub> = ${r.Tc.toFixed(1)} − ${(r.Tvloe??0).toFixed(1)} = <span class="value">${r.SC.toFixed(1)} K</span>
            <div class="result-big">ΔT<sub>onder</sub> = ${r.SC.toFixed(1)} K</div></div>`;
      }
      else if (huidigeKeuze >= 3) {
        html += toonToestanden(r);

        if (huidigeKeuze === 3) {
          html += `<div class="step"><h3>Specifiek koelvermogen ${info('q₀ is de warmte die per kg koudemiddel in de verdamper wordt opgenomen.')}</h3>
            <span class="formula">q₀ = h₁ − h₄</span><br>
            q₀ = ${r.h1.toFixed(1)} − ${r.h4.toFixed(1)} = <span class="value">${r.q0.toFixed(1)} kJ/kg</span>
            <div class="result-big">q₀ = ${r.q0.toFixed(1)} kJ/kg</div></div>`;
        }
        if (huidigeKeuze === 4) {
          html += `<div class="step"><h3>Specifiek condensorvermogen ${info('q<sub>c</sub> is de warmte die per kg koudemiddel in de condensor wordt afgegeven.')}</h3>
            <span class="formula">q<sub>c</sub> = h₂ − h₃</span><br>
            q<sub>c</sub> = ${r.h2.toFixed(1)} − ${r.h3.toFixed(1)} = <span class="value">${r.qc.toFixed(1)} kJ/kg</span>
            <div class="result-big">q<sub>c</sub> = ${r.qc.toFixed(1)} kJ/kg</div></div>`;
        }
        if (huidigeKeuze === 5) {
          html += `<div class="step"><h3>Specifieke compressorarbeid ${info('w is de arbeid die de compressor per kg koudemiddel levert.')}</h3>
            <span class="formula">w = h₂ − h₁</span><br>
            w = ${r.h2.toFixed(1)} − ${r.h1.toFixed(1)} = <span class="value">${r.w.toFixed(1)} kJ/kg</span>
            <div class="result-big">w = ${r.w.toFixed(1)} kJ/kg</div></div>`;
        }
        if (huidigeKeuze === 6) {
          html += `<div class="step"><h3>Koelfactor (EER / COP<sub>R</sub>) ${info('COP<sub>R</sub> (of EER) = koelvermogen / compressorarbeid. Hoe hoger, hoe efficiënter de koelmachine.')}</h3>
            <span class="formula">EER = q₀ / w</span><br>
            EER = ${r.q0.toFixed(1)} / ${r.w.toFixed(1)} = <span class="value">${r.COP_R.toFixed(2)}</span>
            <div class="result-big">EER / COP<sub>R</sub> = ${r.COP_R.toFixed(2)}</div></div>`;
        }
        if (huidigeKeuze === 7) {
          html += `<div class="step"><h3>Warmtefactor (COP<sub>H</sub>) ${info('COP<sub>H</sub> = condensorvermogen / compressorarbeid. Relevant bij warmtepompen.')}</h3>
            <span class="formula">COP<sub>H</sub> = q<sub>c</sub> / w</span><br>
            COP<sub>H</sub> = ${r.qc.toFixed(1)} / ${r.w.toFixed(1)} = <span class="value">${r.COP_H.toFixed(2)}</span>
            <div class="result-big">COP<sub>H</sub> = ${r.COP_H.toFixed(2)}</div></div>`;
        }
        if (huidigeKeuze === 8) {
          html += `<div class="step"><h3>Drukverhouding ${info('π = Pcond / Pevap. Hoe hoger de drukverhouding, hoe zwaarder de compressor moet werken.')}</h3>
            <span class="formula">π = p<sub>c</sub> / p<sub>v</sub></span><br>
            π = ${r.Pc.toFixed(2)} / ${r.Pe.toFixed(2)} = <span class="value">${r.pi.toFixed(2)}</span>
            <div class="result-big">π = ${r.pi.toFixed(2)}</div></div>`;
        }
        if (huidigeKeuze >= 9) {
          if (r.m === null) {
            html += `<div class="step"><p class="warn">Vul compressorvermogen in om massastroom en vermogens te berekenen.</p></div>`;
          } else {
            html += `<div class="step"><h3>Massastroom ${info('ṁ = Wcomp / w. De hoeveelheid koudemiddel die per seconde circuleert.')}</h3>
              <span class="formula">ṁ = W<sub>comp</sub> / w</span><br>
              ṁ = ${r.Wcomp.toFixed(2)} / ${r.w.toFixed(1)} = <span class="value">${r.m.toFixed(4)} kg/s</span>
              <div class="result-big">ṁ = ${r.m.toFixed(4)} kg/s</div></div>`;
            if (huidigeKeuze === 10 || huidigeKeuze === 12) {
              html += `<div class="step"><h3>Totaal koelvermogen ${info('Qevap = ṁ × q₀. Dit is het werkelijke koelvermogen van de installatie in kW.')}</h3>
                Q<sub>verdamper</sub> = ṁ · q₀ = <span class="value">${r.Qevap.toFixed(2)} kW</span>
                <div class="result-big">Q<sub>verdamper</sub> = ${r.Qevap.toFixed(2)} kW</div></div>`;
            }
            if (huidigeKeuze === 11 || huidigeKeuze === 12) {
              html += `<div class="step"><h3>Totaal condensorvermogen ${info('Qcond = ṁ × qc. De warmte die aan de omgeving wordt afgegeven.')}</h3>
                Q<sub>condensor</sub> = ṁ · q<sub>c</sub> = <span class="value">${r.Qcond.toFixed(2)} kW</span>
                <div class="result-big">Q<sub>condensor</sub> = ${r.Qcond.toFixed(2)} kW</div></div>`;
            }
          }
        }

        if (huidigeKeuze === 12) {
          html += `
            <div class="step"><h3>Oververhitting & Onderkoeling</h3>
              ΔT<sub>over</sub> = <span class="value">${r.SH.toFixed(1)} K</span> &nbsp;|&nbsp;
              ΔT<sub>onder</sub> = <span class="value">${r.SC.toFixed(1)} K</span></div>
            <div class="step"><h3>Specifieke grootheden</h3>
              q₀ = <span class="value">${r.q0.toFixed(1)} kJ/kg</span><br>
              w = <span class="value">${r.w.toFixed(1)} kJ/kg</span><br>
              q<sub>c</sub> = <span class="value">${r.qc.toFixed(1)} kJ/kg</span></div>
            <div class="step"><h3>Rendementen</h3>
              EER / COP<sub>R</sub> = <span class="value">${r.COP_R.toFixed(2)}</span><br>
              COP<sub>H</sub> = <span class="value">${r.COP_H.toFixed(2)}</span><br>
              π = <span class="value">${r.pi.toFixed(2)}</span>
              <div class="result-big">COP<sub>R</sub> = ${r.COP_R.toFixed(2)}</div></div>`;
          if (r.m !== null) {
            html += `
              <div class="step"><h3>Massastroom & Vermogens</h3>
                ṁ = <span class="value">${r.m.toFixed(4)} kg/s</span><br>
                W<sub>comp</sub> = <span class="value">${r.Wcomp.toFixed(2)} kW</span><br>
                Q<sub>verdamper</sub> = <span class="value">${r.Qevap.toFixed(2)} kW</span><br>
                Q<sub>condensor</sub> = <span class="value">${r.Qcond.toFixed(2)} kW</span></div>
              <div class="step"><h3>Energiebalans ${info('Volgens de 1e hoofdwet moet Qcond ≈ Qevap + Wcomp zijn. Een kleine afwijking is normaal door afronding.')}</h3>
                Q<sub>cond</sub> ≈ Q<sub>evap</sub> + W<sub>comp</sub><br>
                ${r.Qcond.toFixed(2)} ≈ ${r.Qevap.toFixed(2)} + ${r.Wcomp.toFixed(2)} = ${(r.Qevap + r.Wcomp).toFixed(2)} kW<br>
                ${r.balans === 'OK'
                  ? `<span class="ok">✓ Energiebalans OK (afwijking ${r.balansPct.toFixed(1)} %)</span>`
                  : `<span class="warn">⚠ Energiebalans wijkt ${r.balansPct.toFixed(1)} % af</span>`}</div>`;
          }
        }
      }

      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('resultaat').innerHTML = html;

      if (huidigeKeuze >= 3) {
        document.getElementById('diagramWrap').classList.remove('hidden');
        tekenPH(r);
      } else {
        document.getElementById('diagramWrap').classList.add('hidden');
      }
    }

    function toonToestanden(r) {
      return `
        <div class="step"><h3>Invoer & verzadiging ${info('De verzadigingstemperaturen en -drukken komen uit de koudemiddeltabellen. SH en SC worden uit de gemeten temperaturen berekend.')}</h3>
          Koudemiddel: <span class="value">${r.ref}</span><br>
          T<sub>e</sub> = <span class="value">${r.Te.toFixed(1)} °C</span> → p<sub>v</sub> ≈ ${r.Pe.toFixed(2)} bar<br>
          T<sub>c</sub> = <span class="value">${r.Tc.toFixed(1)} °C</span> → p<sub>c</sub> ≈ ${r.Pc.toFixed(2)} bar<br>
          SH = <span class="value">${r.SH.toFixed(1)} K</span> | SC = <span class="value">${r.SC.toFixed(1)} K</span> | η<sub>is</sub> = ${r.eta.toFixed(2)}</div>
        <div class="step"><h3>Toestandspunten ${info('1 = aanzuiging, 2s = ideale isentrope compressie, 2 = werkelijke compressie, 3 = vloeistof na condensor, 4 = na expansie (h4 = h3).')}</h3>
          <strong>1</strong> Aanzuiging: T₁≈${r.st1.T.toFixed(1)}°C, h₁ = <span class="value">${r.h1.toFixed(1)} kJ/kg</span>, s₁ ≈ ${r.st1.s.toFixed(3)} kJ/kg·K<br>
          <strong>2s</strong> Isentroop: T₂s≈${r.st2s.T.toFixed(1)}°C, h₂s = <span class="value">${r.h2s.toFixed(1)} kJ/kg</span><br>
          <strong>2</strong> Persgas: T₂≈${r.st2.T.toFixed(1)}°C, h₂ = <span class="value">${r.h2.toFixed(1)} kJ/kg</span><br>
          <strong>3</strong> Vloeistof: T₃≈${r.st3.T.toFixed(1)}°C, h₃ = <span class="value">${r.h3.toFixed(1)} kJ/kg</span><br>
          <strong>4</strong> Na expansie (h₄ = h₃): h₄ = <span class="value">${r.h4.toFixed(1)} kJ/kg</span></div>`;
    }

    function tekenPH(r) {
      const canvas = document.getElementById('phCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);

      const tab = data[r.ref] || data.R134a;

      const hs = [r.h1, r.h2, r.h3, r.h4];
      tab.forEach(pt => { hs.push(pt[2]); hs.push(pt[3]); });
      let hMin = Math.min(...hs) - 25;
      let hMax = Math.max(...hs) + 35;
      hMin = Math.max(80, hMin);
      hMax = Math.min(520, hMax);

      let pMin = Math.min(r.Pe, r.Pc) * 0.45;
      let pMax = Math.max(r.Pe, r.Pc) * 1.9;
      pMin = Math.max(0.2, pMin);
      pMax = Math.min(40, pMax);

      const left=70, right=25, top=28, bottom=48;
      const plotW = W-left-right, plotH = H-top-bottom;

      function x(h){ return left + (h-hMin)/(hMax-hMin)*plotW; }
      function y(p){
        const lp = Math.log10(Math.max(p,0.1));
        return top + plotH - (lp-Math.log10(pMin))/(Math.log10(pMax)-Math.log10(pMin))*plotH;
      }

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0,0,W,H);

      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
      for (let h = Math.ceil(hMin/50)*50; h <= hMax; h += 50) {
        ctx.beginPath(); ctx.moveTo(x(h),top); ctx.lineTo(x(h),top+plotH); ctx.stroke();
      }

      // Dampkoepel
      ctx.beginPath(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.4;
      tab.forEach((pt,i) => { const xx=x(pt[2]),yy=y(pt[1]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
      ctx.stroke();
      ctx.beginPath(); ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 2.4;
      tab.forEach((pt,i) => { const xx=x(pt[3]),yy=y(pt[1]); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); });
      ctx.stroke();

      // Cyclus
      ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(x(r.h4), y(r.Pe));
      ctx.lineTo(x(r.h1), y(r.Pe));
      ctx.lineTo(x(r.h2), y(r.Pc));
      ctx.lineTo(x(r.h3), y(r.Pc));
      ctx.lineTo(x(r.h4), y(r.Pe));
      ctx.stroke();

      // Punten inclusief 2s
      const pts = [
        {h:r.h1, p:r.Pe, l:'1'},
        {h:r.h2s, p:r.Pc, l:'2s'},
        {h:r.h2, p:r.Pc, l:'2'},
        {h:r.h3, p:r.Pc, l:'3'},
        {h:r.h4, p:r.Pe, l:'4'}
      ];
      pts.forEach(pt=>{
        ctx.beginPath(); ctx.fillStyle = pt.l==='2s' ? '#a78bfa' : '#fbbf24';
        ctx.arc(x(pt.h),y(pt.p), pt.l==='2s'?5:6.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#0f172a'; ctx.font = 'bold 10px system-ui';
        ctx.fillText(pt.l, x(pt.h)- (pt.l.length>1?6:3), y(pt.p)+3.5);
      });

      // Assen
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(left, top+plotH); ctx.lineTo(left+plotW, top+plotH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(left, top+plotH); ctx.stroke();

      ctx.fillStyle = '#94a3b8'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      for (let h = Math.ceil(hMin/50)*50; h <= hMax; h += 50) {
        ctx.fillText(h.toString(), x(h), top+plotH+15);
      }
      ctx.font = '12px system-ui';
      ctx.fillText('Enthalpie h (kJ/kg)', left+plotW/2, H-6);

      ctx.textAlign = 'right'; ctx.font = '11px system-ui';
      [0.3,0.5,1,2,3,5,10,15,20,30].forEach(p=>{
        if (p>=pMin && p<=pMax) ctx.fillText(p.toString(), left-5, y(p)+3);
      });
      ctx.save(); ctx.translate(14, top+plotH/2); ctx.rotate(-Math.PI/2);
      ctx.textAlign = 'center'; ctx.font = '12px system-ui';
      ctx.fillText('Druk p (bar abs) – log', 0, 0); ctx.restore();

      ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'left';
      ctx.fillText(r.ref + ' – log p-h', left, 16);
    }

    function terug() {
      document.getElementById('menuCard').classList.remove('hidden');
      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('diagramWrap').classList.add('hidden');
    }
  </script>
</body>
</html>
