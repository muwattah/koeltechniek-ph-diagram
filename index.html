<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koeltechniek Categorie 1 – Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 6px; font-size: 1.5rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 22px; border: 1px solid #334155; margin-bottom: 18px; }
    h2 { color: #38bdf8; font-size: 1.15rem; margin-bottom: 14px; }
    .menu-btn { display: block; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 8px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; }
    .menu-btn:hover { background: #1e293b; border-color: #0ea5e9; color: #38bdf8; }
    .menu-btn.active { background: #0ea5e9; border-color: #0ea5e9; color: white; }
    label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #94a3b8; }
    input, select { width: 100%; padding: 10px 12px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
    button.calc { width: 100%; padding: 13px; background: #0ea5e9; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
    button.calc:hover { background: #0284c7; }
    button.back { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 10px; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
    button.back:hover { border-color: #94a3b8; color: #e2e8f0; }
    .step { background: #0f172a; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; border-left: 4px solid #0ea5e9; }
    .step h3 { color: #38bdf8; font-size: 0.95rem; margin-bottom: 8px; }
    .formula { font-family: ui-monospace, monospace; background: #1e293b; padding: 3px 7px; border-radius: 4px; color: #4ade80; }
    .value { color: #fbbf24; font-weight: 600; }
    .result-big { font-size: 1.4rem; font-weight: 700; color: #4ade80; margin-top: 8px; }
    .hidden { display: none; }
    .note { font-size: 0.8rem; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Koeltechniek – Categorie 1</h1>
    <p class="subtitle">Kies een berekening → vul alleen de benodigde gegevens in → krijg stap-voor-stap uitwerking</p>

    <!-- MENU -->
    <div class="card" id="menuCard">
      <h2>Welke berekening wil je uitvoeren?</h2>
      <button class="menu-btn" onclick="kies(1)">1. Oververhitting (ΔT<sub>over</sub>)</button>
      <button class="menu-btn" onclick="kies(2)">2. Onderkoeling (ΔT<sub>onder</sub>)</button>
      <button class="menu-btn" onclick="kies(3)">3. Specifiek koelvermogen (ε<sub>k</sub> / q₀)</button>
      <button class="menu-btn" onclick="kies(4)">4. Specifiek condensorvermogen (ε<sub>w</sub> / q<sub>c</sub>)</button>
      <button class="menu-btn" onclick="kies(5)">5. Specifieke compressorarbeid (Δh<sub>comp</sub> / w)</button>
      <button class="menu-btn" onclick="kies(6)">6. Koelfactor (EER)</button>
      <button class="menu-btn" onclick="kies(7)">7. Warmtefactor (COP)</button>
      <button class="menu-btn" onclick="kies(8)">8. Drukverhouding (π)</button>
      <button class="menu-btn" onclick="kies(9)">9. Massastroom (ṁ)</button>
      <button class="menu-btn" onclick="kies(10)">10. Totaal koelvermogen (Q<sub>verdamper</sub>)</button>
      <button class="menu-btn" onclick="kies(11)">11. Totaal condensorvermogen (Q<sub>condensor</sub>)</button>
      <button class="menu-btn" onclick="kies(12)">12. Complete set (meerdere tegelijk)</button>
    </div>

    <!-- INPUT FORMULIER (dynamisch) -->
    <div class="card hidden" id="inputCard">
      <h2 id="inputTitel">Gegevens</h2>
      <div id="inputVelden"></div>
      <button class="calc" onclick="uitvoeren()">Bereken</button>
      <button class="back" onclick="terug()">← Terug naar menu</button>
    </div>

    <!-- RESULTAAT -->
    <div class="card hidden" id="resultCard">
      <h2>Stap-voor-stap uitwerking</h2>
      <div id="resultaat"></div>
      <button class="back" onclick="terug()">← Nieuwe berekening</button>
    </div>
  </div>

  <script>
    let huidigeKeuze = 0;

    const berekeningen = {
      1: {
        titel: "1. Oververhitting (ΔT<sub>over</sub>)",
        velden: [
          { id: "tz", label: "T<sub>zuiggas</sub> of T<sub>persgas</sub> (°C)", placeholder: "bijv. 30" },
          { id: "tevap", label: "T<sub>verdamping</sub> (°C)", placeholder: "bijv. -13" }
        ],
        bereken: (v) => {
          const dT = v.tz - v.tevap;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">ΔT<sub>over</sub> = T<sub>zuiggas</sub> − T<sub>verdamping</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              ΔT<sub>over</sub> = ${v.tz} − (${v.tevap}) = <span class="value">${dT.toFixed(1)} K</span>
              <div class="result-big">ΔT<sub>over</sub> = ${dT.toFixed(1)} K</div>
              ${dT > 20 ? '<p style="color:#f87171;margin-top:8px;">Let op: dit is zeer hoog. Waarschijnlijk is dit de persgastemperatuur in plaats van de zuiggastemperatuur.</p>' : '<p style="color:#94a3b8;margin-top:8px;">Normale zuigoververhitting ligt meestal tussen 5 en 12 K.</p>'}
            </div>`;
        }
      },
      2: {
        titel: "2. Onderkoeling (ΔT<sub>onder</sub>)",
        velden: [
          { id: "tcond", label: "T<sub>condensatie</sub> (°C)", placeholder: "bijv. 37" },
          { id: "tvloe", label: "T<sub>vloeistof</sub> (°C)", placeholder: "bijv. 26" }
        ],
        bereken: (v) => {
          const dT = v.tcond - v.tvloe;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">ΔT<sub>onder</sub> = T<sub>condensatie</sub> − T<sub>vloeistof</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              ΔT<sub>onder</sub> = ${v.tcond} − ${v.tvloe} = <span class="value">${dT.toFixed(1)} K</span>
              <div class="result-big">ΔT<sub>onder</sub> = ${dT.toFixed(1)} K</div>
            </div>`;
        }
      },
      3: {
        titel: "3. Specifiek koelvermogen (ε<sub>k</sub> / q₀)",
        velden: [
          { id: "h1", label: "h<sub>aanzuiging</sub> / h₁ (kJ/kg)", placeholder: "bijv. 410" },
          { id: "h4", label: "h<sub>vloeistof</sub> / h₄ (kJ/kg)", placeholder: "bijv. 240" }
        ],
        bereken: (v) => {
          const ek = v.h1 - v.h4;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">ε<sub>k</sub> = h<sub>aanzuiging</sub> − h<sub>vloeistof</sub> &nbsp; (= h₁ − h₄)</span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              ε<sub>k</sub> = ${v.h1} − ${v.h4} = <span class="value">${ek.toFixed(1)} kJ/kg</span>
              <div class="result-big">ε<sub>k</sub> = ${ek.toFixed(1)} kJ/kg</div>
            </div>`;
        }
      },
      4: {
        titel: "4. Specifiek condensorvermogen (ε<sub>w</sub> / q<sub>c</sub>)",
        velden: [
          { id: "h2", label: "h<sub>persgas</sub> / h₂ (kJ/kg)", placeholder: "bijv. 440" },
          { id: "h3", label: "h<sub>vloeistof</sub> / h₃ (kJ/kg)", placeholder: "bijv. 240" }
        ],
        bereken: (v) => {
          const ew = v.h2 - v.h3;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">ε<sub>w</sub> = h<sub>persgas</sub> − h<sub>vloeistof</sub> &nbsp; (= h₂ − h₃)</span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              ε<sub>w</sub> = ${v.h2} − ${v.h3} = <span class="value">${ew.toFixed(1)} kJ/kg</span>
              <div class="result-big">ε<sub>w</sub> = ${ew.toFixed(1)} kJ/kg</div>
            </div>`;
        }
      },
      5: {
        titel: "5. Specifieke compressorarbeid (Δh<sub>comp</sub> / w)",
        velden: [
          { id: "h2", label: "h<sub>persgas</sub> / h₂ (kJ/kg)", placeholder: "bijv. 440" },
          { id: "h1", label: "h<sub>aanzuiging</sub> / h₁ (kJ/kg)", placeholder: "bijv. 410" }
        ],
        bereken: (v) => {
          const w = v.h2 - v.h1;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">Δh<sub>comp</sub> = h<sub>persgas</sub> − h<sub>aanzuiging</sub> &nbsp; (= h₂ − h₁)</span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              Δh<sub>comp</sub> = ${v.h2} − ${v.h1} = <span class="value">${w.toFixed(1)} kJ/kg</span>
              <div class="result-big">Δh<sub>comp</sub> = ${w.toFixed(1)} kJ/kg</div>
            </div>`;
        }
      },
      6: {
        titel: "6. Koelfactor (EER)",
        velden: [
          { id: "ek", label: "ε<sub>k</sub> (kJ/kg)", placeholder: "bijv. 170" },
          { id: "w", label: "Δh<sub>comp</sub> (kJ/kg)", placeholder: "bijv. 30" }
        ],
        bereken: (v) => {
          const eer = v.ek / v.w;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">EER = ε<sub>k</sub> / Δh<sub>comp</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              EER = ${v.ek} / ${v.w} = <span class="value">${eer.toFixed(2)}</span>
              <div class="result-big">EER = ${eer.toFixed(2)}</div>
            </div>`;
        }
      },
      7: {
        titel: "7. Warmtefactor (COP)",
        velden: [
          { id: "ew", label: "ε<sub>w</sub> (kJ/kg)", placeholder: "bijv. 200" },
          { id: "w", label: "Δh<sub>comp</sub> (kJ/kg)", placeholder: "bijv. 30" }
        ],
        bereken: (v) => {
          const cop = v.ew / v.w;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">COP = ε<sub>w</sub> / Δh<sub>comp</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              COP = ${v.ew} / ${v.w} = <span class="value">${cop.toFixed(2)}</span>
              <div class="result-big">COP = ${cop.toFixed(2)}</div>
            </div>`;
        }
      },
      8: {
        titel: "8. Drukverhouding (π)",
        velden: [
          { id: "pc", label: "p<sub>condensatie</sub> abs (bar)", placeholder: "bijv. 9.7" },
          { id: "pv", label: "p<sub>verdamping</sub> abs (bar)", placeholder: "bijv. 1.8" }
        ],
        bereken: (v) => {
          const pi = v.pc / v.pv;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">π = p<sub>condensatie (abs)</sub> / p<sub>verdamping (abs)</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              π = ${v.pc} / ${v.pv} = <span class="value">${pi.toFixed(2)}</span>
              <div class="result-big">π = ${pi.toFixed(2)}</div>
              <p style="color:#94a3b8;margin-top:8px;">Typische waarden liggen tussen 3 en 8, afhankelijk van de toepassing.</p>
            </div>`;
        }
      },
      9: {
        titel: "9. Massastroom (ṁ)",
        velden: [
          { id: "qcomp", label: "Q<sub>compressor</sub> (kW)", placeholder: "bijv. 1.34" },
          { id: "w", label: "Δh<sub>comp</sub> (kJ/kg)", placeholder: "bijv. 30" }
        ],
        bereken: (v) => {
          const m = v.qcomp / v.w;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">ṁ = Q<sub>compressor</sub> / Δh<sub>comp</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              ṁ = ${v.qcomp} / ${v.w} = <span class="value">${m.toFixed(4)} kg/s</span>
              <div class="result-big">ṁ = ${m.toFixed(4)} kg/s</div>
            </div>`;
        }
      },
      10: {
        titel: "10. Totaal koelvermogen (Q<sub>verdamper</sub>)",
        velden: [
          { id: "m", label: "Massastroom ṁ (kg/s)", placeholder: "bijv. 0.0447" },
          { id: "ek", label: "ε<sub>k</sub> (kJ/kg)", placeholder: "bijv. 170" }
        ],
        bereken: (v) => {
          const q = v.m * v.ek;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">Q<sub>verdamper</sub> = ṁ · ε<sub>k</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              Q<sub>verdamper</sub> = ${v.m} · ${v.ek} = <span class="value">${q.toFixed(2)} kW</span>
              <div class="result-big">Q<sub>verdamper</sub> = ${q.toFixed(2)} kW</div>
            </div>`;
        }
      },
      11: {
        titel: "11. Totaal condensorvermogen (Q<sub>condensor</sub>)",
        velden: [
          { id: "m", label: "Massastroom ṁ (kg/s)", placeholder: "bijv. 0.0447" },
          { id: "ew", label: "ε<sub>w</sub> (kJ/kg)", placeholder: "bijv. 200" }
        ],
        bereken: (v) => {
          const q = v.m * v.ew;
          return `
            <div class="step">
              <h3>Formule</h3>
              <span class="formula">Q<sub>condensor</sub> = ṁ · ε<sub>w</sub></span>
            </div>
            <div class="step">
              <h3>Invullen</h3>
              Q<sub>condensor</sub> = ${v.m} · ${v.ew} = <span class="value">${q.toFixed(2)} kW</span>
              <div class="result-big">Q<sub>condensor</sub> = ${q.toFixed(2)} kW</div>
            </div>`;
        }
      },
      12: {
        titel: "12. Complete set",
        velden: [
          { id: "tz", label: "T<sub>zuiggas</sub> / T<sub>persgas</sub> (°C)", placeholder: "30" },
          { id: "tevap", label: "T<sub>verdamping</sub> (°C)", placeholder: "-13" },
          { id: "tcond", label: "T<sub>condensatie</sub> (°C)", placeholder: "37" },
          { id: "tvloe", label: "T<sub>vloeistof</sub> (°C)", placeholder: "26" },
          { id: "h1", label: "h₁ aanzuiging (kJ/kg)", placeholder: "410" },
          { id: "h2", label: "h₂ persgas (kJ/kg)", placeholder: "440" },
          { id: "h3", label: "h₃ vloeistof (kJ/kg)", placeholder: "240" },
          { id: "h4", label: "h₄ na expansie (kJ/kg)", placeholder: "240" },
          { id: "qcomp", label: "Q<sub>compressor</sub> (kW)", placeholder: "1.34" },
          { id: "pc", label: "p<sub>c</sub> abs (bar)", placeholder: "9.7" },
          { id: "pv", label: "p<sub>v</sub> abs (bar)", placeholder: "1.8" }
        ],
        bereken: (v) => {
          const dTover = v.tz - v.tevap;
          const dTonder = v.tcond - v.tvloe;
          const ek = v.h1 - v.h4;
          const ew = v.h2 - v.h3;
          const w = v.h2 - v.h1;
          const eer = ek / w;
          const cop = ew / w;
          const pi = v.pc / v.pv;
          const m = v.qcomp / w;
          const qverd = m * ek;
          const qcond = m * ew;

          return `
            <div class="step"><h3>1. Oververhitting</h3>
              ΔT<sub>over</sub> = ${v.tz} − (${v.tevap}) = <span class="value">${dTover.toFixed(1)} K</span></div>
            <div class="step"><h3>2. Onderkoeling</h3>
              ΔT<sub>onder</sub> = ${v.tcond} − ${v.tvloe} = <span class="value">${dTonder.toFixed(1)} K</span></div>
            <div class="step"><h3>3. Specifiek koelvermogen ε<sub>k</sub></h3>
              ε<sub>k</sub> = ${v.h1} − ${v.h4} = <span class="value">${ek.toFixed(1)} kJ/kg</span></div>
            <div class="step"><h3>4. Specifiek condensorvermogen ε<sub>w</sub></h3>
              ε<sub>w</sub> = ${v.h2} − ${v.h3} = <span class="value">${ew.toFixed(1)} kJ/kg</span></div>
            <div class="step"><h3>5. Specifieke compressorarbeid</h3>
              Δh<sub>comp</sub> = ${v.h2} − ${v.h1} = <span class="value">${w.toFixed(1)} kJ/kg</span></div>
            <div class="step"><h3>6. EER</h3>
              EER = ${ek.toFixed(1)} / ${w.toFixed(1)} = <span class="value">${eer.toFixed(2)}</span></div>
            <div class="step"><h3>7. COP</h3>
              COP = ${ew.toFixed(1)} / ${w.toFixed(1)} = <span class="value">${cop.toFixed(2)}</span>
              <div class="result-big">COP = ${cop.toFixed(2)}</div></div>
            <div class="step"><h3>8. Drukverhouding</h3>
              π = ${v.pc} / ${v.pv} = <span class="value">${pi.toFixed(2)}</span></div>
            <div class="step"><h3>9. Massastroom</h3>
              ṁ = ${v.qcomp} / ${w.toFixed(1)} = <span class="value">${m.toFixed(4)} kg/s</span></div>
            <div class="step"><h3>10. Q<sub>verdamper</sub></h3>
              Q<sub>verdamper</sub> = ${m.toFixed(4)} · ${ek.toFixed(1)} = <span class="value">${qverd.toFixed(2)} kW</span></div>
            <div class="step"><h3>11. Q<sub>condensor</sub></h3>
              Q<sub>condensor</sub> = ${m.toFixed(4)} · ${ew.toFixed(1)} = <span class="value">${qcond.toFixed(2)} kW</span></div>`;
        }
      }
    };

    function kies(nr) {
      huidigeKeuze = nr;
      const b = berekeningen[nr];
      document.getElementById('menuCard').classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('inputCard').classList.remove('hidden');
      document.getElementById('inputTitel').innerHTML = b.titel;

      let html = '';
      b.velden.forEach(veld => {
        html += `<label>${veld.label}</label>
                 <input type="number" id="${veld.id}" step="any" placeholder="${veld.placeholder || ''}">`;
      });
      document.getElementById('inputVelden').innerHTML = html;
    }

    function uitvoeren() {
      const b = berekeningen[huidigeKeuze];
      const waarden = {};
      let ontbreekt = false;

      b.velden.forEach(veld => {
        const el = document.getElementById(veld.id);
        const val = parseFloat(el.value);
        if (isNaN(val)) {
          el.style.borderColor = '#f87171';
          ontbreekt = true;
        } else {
          el.style.borderColor = '#475569';
          waarden[veld.id] = val;
        }
      });

      if (ontbreekt) {
        alert('Vul alle gevraagde gegevens in.');
        return;
      }

      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('resultaat').innerHTML = b.bereken(waarden);
    }

    function terug() {
      document.getElementById('menuCard').classList.remove('hidden');
      document.getElementById('inputCard').classList.add('hidden');
      document.getElementById('resultCard').classList.add('hidden');
    }
  </script>
</body>
</html>
